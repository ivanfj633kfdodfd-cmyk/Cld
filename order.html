<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Создать заказ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    background: #17212b;
    color: white;
    min-height: 100vh;
    padding: 20px;
}

/* Шапка как на витрине */
.shop-header {
    text-align: center;
    margin-bottom: 20px;
}

.shop-header img {
    width: 160px;
    display: block;
    margin: 0 auto 10px;
}

.shop-header .title {
    color: #6ab2f2;
    font-weight: bold;
    font-size: 15px;
}

.shop-header .subtitle {
    color: white;
    font-size: 13px;
    margin-top: 4px;
}

/* Секции */
.section {
    background: #253648;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
}

.section-label {
    color: #6ab2f2;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
}

.form-group {
    margin-bottom: 10px;
}

.form-group:last-child {
    margin-bottom: 0;
}

label {
    display: block;
    color: #6ab2f2;
    font-size: 12px;
    margin-bottom: 5px;
}

input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #3a5068;
    background: #17212b;
    color: white;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
    -webkit-appearance: none;
}

input:focus, select:focus, textarea:focus {
    border-color: #6ab2f2;
}

select {
    background-image: url('data:image/svg+xml;utf8,<svg fill="%236ab2f2" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 36px;
}

select option { background: #17212b; }

select:disabled { opacity: 0.45; }

textarea {
    resize: none;
    height: 65px;
    font-size: 13px;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
    opacity: 0.4;
}

.row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* Чекбокс доставки */
.delivery-row {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #3a5068;
    background: #17212b;
    transition: border-color 0.2s;
}

.delivery-row:hover { border-color: #6ab2f2; }

.delivery-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    min-width: 18px;
    cursor: pointer;
    accent-color: #6ab2f2;
    padding: 0;
    background: transparent;
    border: none;
    appearance: auto;
    -webkit-appearance: auto;
}

.delivery-row span {
    font-size: 13px;
    color: #aad4f5;
}

#address-block {
    display: none; /* не используется */
}

/* Превью */
.preview-box {
    background: #1d2b3a;
    border: 1px solid #3a5068;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 13px;
    display: none;
}

.preview-box.visible { display: block; }

.preview-title {
    color: #6ab2f2;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}

.preview-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid #243444;
    padding: 5px 0;
    gap: 8px;
}

.preview-row:last-child { border-bottom: none; }
.preview-key { color: #6ab2f2; white-space: nowrap; flex-shrink: 0; }
.preview-val { color: white; text-align: right; word-break: break-all; }

.order-badge {
    background: #2f6ea5;
    color: white;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: bold;
}

/* Кнопка */
.submit-btn {
    width: 75vw;
    margin: 4px auto 0;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    background: #2f6ea5;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: block;
    transition: background 0.2s, transform 0.1s;
    text-align: center;
}

.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.status-msg {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
    color: #89ED5E;
    padding-bottom: 20px;
}

.status-msg.error { color: #ff6b6b; }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// Инициализируем сразу после загрузки SDK
var tg = window.Telegram && window.Telegram.WebApp;
var chatId = null;
if (tg) {
    tg.ready();
    tg.expand();
    try {
        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
            chatId = tg.initDataUnsafe.user.id;
        }
    } catch(e) {}
}
</script>
<body>

<!-- ШАПКА КАК НА ВИТРИНЕ -->
<div class="shop-header">
    <img src="https://github.com/HuntersNetPlus/PvZ/blob/main/Gemini_Generated_Image_qobu9jqobu9jqobu%20(1).webp?raw=true" alt="">
    <div class="title">Создать заказ</div>
    <div class="subtitle">Быстро, анонимно и круглосуточно.</div>
</div>

<!-- ЛОКАЦИЯ -->
<div class="section">
    <div class="section-label">Локация</div>

    <div class="form-group">
        <label>Город</label>
        <select id="city">
            <option value="">Выберите город</option>
            <option value="moscow">Москва</option>
            <option value="spb">Санкт-Петербург</option>
            <option value="kazan">Казань</option>
            <option value="novgorod">Нижний Новгород</option>
            <option value="samara">Самара</option>
            <option value="novosib">Новосибирск</option>
            <option value="ekb">Екатеринбург</option>
        </select>
    </div>

    <div class="form-group">
        <label>Станция метро</label>
        <select id="metro" disabled>
            <option value="">Сначала выберите город</option>
        </select>
    </div>

    <div class="form-group">
        <label class="delivery-row" for="delivery-check">
            <input type="checkbox" id="delivery-check">
            <span>Адресная доставка</span>
        </label>
    </div>
</div>

<!-- ТОВАР -->
<div class="section">
    <div class="section-label">Позиция</div>
    <div class="row2">
        <div class="form-group">
            <label>Вещество</label>
            <select id="substance">
                <option value="">Выберите</option>
                <option>ZAS</option>
                <option>Экстази</option>
                <option>Бутират GHB</option>
                <option>Крек</option>
                <option>Xanax</option>
                <option>Лирика</option>
                <option>Мефедрон</option>
                <option>Мефедрон (мука)</option>
                <option>Кокаин</option>
                <option>A-PVP</option>
                <option>Гашиш Ice-o-Lator</option>
                <option>Гашиш Mercedes Benz</option>
                <option>Бошки Amnesia Haze</option>
                <option>Бошки Critical Kush</option>
                <option>Бошки Gorilla Kush</option>
                <option>Бошки White Widow</option>
                <option>Амфетамин</option>
            </select>
        </div>
        <div class="form-group">
            <label>Количество (гр / мл)</label>
            <input type="text" id="amount" placeholder="напр. 2 гр">
        </div>
    </div>
</div>

<!-- ОПЛАТА -->
<div class="section">
    <div class="section-label">Оплата</div>
    <div class="row2">
        <div class="form-group">
            <label>Сумма (руб)</label>
            <input type="number" id="price-rub" placeholder="5220" min="0">
        </div>
        <div class="form-group">
            <label>Способ</label>
            <select id="pay-method" onchange="onPayMethodChange()">
                <option value="СБП">СБП</option>
                <option value="Карта">Карта</option>
                <option value="USDT TRC-20">USDT TRC-20</option>
                <option value="USDT ERC-20">USDT ERC-20</option>
                <option value="BTC">BTC</option>
                <option value="ETH">ETH</option>
                <option value="LTC">LTC</option>
            </select>
        </div>
    </div>
    <div class="form-group" id="requisites-group">
        <label id="req-label">Реквизиты</label>
        <input type="text" id="requisites" placeholder="Номер карты / телефон">
    </div>
    <div class="form-group">
        <label>Комментарий (необязательно)</label>
        <textarea id="comment" placeholder="Дополнительная информация..."></textarea>
    </div>
</div>

<!-- ПРЕВЬЮ -->
<div class="preview-box" id="preview">
    <div class="preview-title">Предпросмотр заказа</div>
    <div id="preview-content"></div>
</div>

<button class="submit-btn" id="send-btn" disabled>Сформировать заказ</button>
<div class="status-msg" id="status"></div>

<script>
// ===== ДАННЫЕ МЕТРО =====
var metroData = {
    moscow: ["Александровский сад","Алексеевская","Альма-Атинская","Аминьевская","Аннино","Аэропорт","Автозаводская","Бабушкинская","Багратионовская","Баррикадная","Бауманская","Беговая","Беломорская","Белорусская","Беляево","Бибирево","Библиотека имени Ленина","Битцевский парк","Борисово","Ботанический сад","Братиславская","Бульвар Дмитрия Донского","Бульвар Рокоссовского","Бунинская аллея","Бутырская","ВДНХ","Верхние Лихоборы","Владыкино","Водный стадион","Войковская","Волгоградский проспект","Волжская","Волоколамская","Воробьёвы горы","Воронцовская","Выставочная","Выхино","Динамо","Дмитровская","Добрынинская","Домодедовская","Достоевская","Жулебино","Зябликово","Измайловская","Калужская","Кантемировская","Каширская","Киевская","Китай-город","Кожуховская","Коломенская","Коммунарка","Коньково","Котельники","Красногвардейская","Краснопресненская","Красносельская","Красные Ворота","Кропоткинская","Крылатское","Кузнецкий Мост","Кузьминки","Кунцевская","Курская","Кутузовская","Ленинский проспект","Лермонтовский проспект","Лесопарковая","Лефортово","Лихоборы","Ломоносовский проспект","Лубянка","Лужники","Люблино","Марина Роща","Марксистская","Марьино","Маяковская","Медведково","Международная","Менделеевская","Минская","Молодёжная","Нагатинская","Нагорная","Нахимовский проспект","Некрасовка","Нижегородская","Новогиреево","Новокосино","Новокузнецкая","Новопеределкино","Новослободская","Новые Черёмушки","Окружная","Охотный Ряд","Павелецкая","Панфиловская","Парк Победы","Парк культуры","Партизанская","Петровский парк","Печатники","Пионерская","Планерная","Площадь Гагарина","Площадь Ильича","Площадь Революции","Полежаевская","Полянка","Пражская","Прокшино","Проспект Вернадского","Проспект Мира","Профсоюзная","Пушкинская","Раменки","Рассказовка","Рижская","Римская","Румянцево","Савёловская","Саларьево","Свиблово","Севастопольская","Селигерская","Семеновская","Серпуховская","Славянский бульвар","Смоленская","Сокольники","Солнцево","Спортивная","Сретенский бульвар","Строгино","Студенческая","Суворовская","Сухаревская","Сходненская","Таганская","Текстильщики","Тёплый Стан","Технопарк","Тимирязевская","Третьяковская","Тропарёво","Трубная","Тульская","Тургеневская","Тушинская","Угрешская","Улица 1905 года","Университет","Фили","Фонвизинская","Хорошёвская","Ховрино","Царицыно","Цветной бульвар","ЦСКА","Черкизовская","Чертановская","Чеховская","Чистые пруды","Чкаловская","Шаболовская","Шелепиха","Шипиловская","Щёлковская","Щукинская","Электрозаводская","Юго-Западная","Южная","Якиманка","Ясенево"],
    spb: ["Автово","Адмиралтейская","Академическая","Балтийская","Василеостровская","Владимирская","Волковская","Выборгская","Горьковская","Гостиный двор","Гражданский проспект","Девяткино","Достоевская","Елизаровская","Звёздная","Кировский завод","Комендантский проспект","Крестовский остров","Купчино","Ладожская","Ленинский проспект","Лесная","Лиговский проспект","Ломоносовская","Маяковская","Международная","Московская","Московские ворота","Нарвская","Невский проспект","Новочеркасская","Обводный канал","Обухово","Озерки","Парк Победы","Парнас","Петроградская","Пионерская","Площадь Александра Невского","Площадь Восстания","Площадь Ленина","Площадь Мужества","Политехническая","Приморская","Проспект Большевиков","Проспект Ветеранов","Проспект Просвещения","Пушкинская","Рыбацкое","Садовая","Сенная площадь","Спасская","Спортивная","Старая Деревня","Технологический институт","Удельная","Улица Дыбенко","Фрунзенская","Чёрная речка","Чернышевская","Чкаловская","Электросила"],
    kazan: ["Аметьево","Горки","Кремлёвская","Проспект Победы","Суконная Слобода","Северный вокзал","Пионерская","Площадь Тукая","Яшьлек"],
    novgorod: ["Парк культуры","Горьковская","Московская","Канавинская","Площадь 1905 года","Стрелка"],
    novosib: ["Берёзовая роща","Гагаринская","Золотая Нива","Заельцовская","Красный Проспект","Маршала Покрышкина","Октябрьская","Площадь Маркса","Площадь Ленина","Речной вокзал","Студенческая","Сибирская","Площадь Гарина-Михайловского"],
    samara: ["Алабинская","Российская","Московская","Гагаринская","Спортивная","Советская","Победа","Безымянка","Кировская","Юнгородок"],
    ekb: ["Ботаническая","Геологическая","Площадь 1905 года","Проспект Космонавтов","Уралмаш","Чкаловская","Динамо"]
};

var cityNames = {
    moscow: 'Москва', spb: 'Санкт-Петербург', kazan: 'Казань',
    novgorod: 'Нижний Новгород', samara: 'Самара', novosib: 'Новосибирск', ekb: 'Екатеринбург'
};

// ===== ЭЛЕМЕНТЫ =====
var cityEl       = document.getElementById('city');
var metroEl      = document.getElementById('metro');
var deliveryCh   = document.getElementById('delivery-check');
var substanceEl  = document.getElementById('substance');
var amountEl     = document.getElementById('amount');
var priceEl      = document.getElementById('price-rub');
var payMethodEl  = document.getElementById('pay-method');
var reqEl        = document.getElementById('requisites');
var commentEl    = document.getElementById('comment');
var sendBtn      = document.getElementById('send-btn');
var statusEl     = document.getElementById('status');
var preview      = document.getElementById('preview');
var previewContent = document.getElementById('preview-content');

// ===== TELEGRAM WebApp (инициализирован в head) =====

// ===== ГОРОД → МЕТРО =====
cityEl.addEventListener('change', function() {
    var city = this.value;
    metroEl.innerHTML = '';
    if (city && metroData[city]) {
        metroEl.disabled = false;
        var def = document.createElement('option');
        def.value = '';
        def.textContent = 'Выберите станцию';
        metroEl.appendChild(def);
        metroData[city].forEach(function(s) {
            var opt = document.createElement('option');
            opt.value = s; opt.textContent = s;
            metroEl.appendChild(opt);
        });
    } else {
        metroEl.disabled = true;
        var def2 = document.createElement('option');
        def2.textContent = 'Сначала выберите город';
        metroEl.appendChild(def2);
    }
    updatePreview();
});

metroEl.addEventListener('change', updatePreview);

// ===== ДОСТАВКА =====
deliveryCh.addEventListener('change', updatePreview);

// ===== LIVE PREVIEW =====
[substanceEl, amountEl, priceEl, payMethodEl, reqEl, commentEl].forEach(function(el) {
    el.addEventListener('input', updatePreview);
    el.addEventListener('change', updatePreview);
});

function generateOrderId() {
    return Math.floor(10000 + Math.random() * 90000);
}
var currentOrderId = generateOrderId();

function getLocation() {
    var city  = cityNames[cityEl.value] || '';
    var metro = metroEl.value || '';
    var delivery = deliveryCh.checked ? ' (адресная доставка)' : '';

    var parts = [];
    if (city)  parts.push(city);
    if (metro) parts.push(metro + delivery);
    else if (city && delivery) parts[0] += delivery;
    return parts.join(', ') || '—';
}

function isFormValid() {
    return cityEl.value && metroEl.value
        && substanceEl.value && amountEl.value.trim()
        && priceEl.value && reqEl.value.trim();
}

function updatePreview() {
    if (!isFormValid()) {
        preview.classList.remove('visible');
        sendBtn.disabled = true;
        return;
    }

    var loc     = getLocation();
    var product = substanceEl.value + ' ' + amountEl.value.trim();
    var price   = Number(priceEl.value).toLocaleString('ru-RU') + ' руб';
    var req     = reqEl.value.trim();
    var comment = commentEl.value.trim();

    var rows = [
        ['Заказ', '<span class="order-badge">#' + currentOrderId + '</span>'],
        ['Локация', loc],
        ['Позиция', product],
        ['Сумма', price],
        ['Оплата', payMethodEl.value],
        ['Реквизиты', req],
    ];
    if (comment) rows.push(['Комментарий', comment]);
    rows.push(['Статус', 'Заказ ожидает оплаты']);

    previewContent.innerHTML = rows.map(function(r) {
        return '<div class="preview-row">'
            + '<span class="preview-key">' + r[0] + '</span>'
            + '<span class="preview-val">'  + r[1] + '</span>'
            + '</div>';
    }).join('');

    preview.classList.add('visible');
    sendBtn.disabled = false;
}

// ===== КРИПТО-АДРЕСА (предзаполнение) =====
var cryptoWallets = {
    'USDT TRC-20': 'TLZu5cha5JvmJiMAtdswudzfMJjxAwH6WH',
    'USDT ERC-20': '0xe1B6bEfAa7E23835b94950d38CfC160FBE876e52',
    'BTC':         'bc1qvpzg2s44nnnpjqgqze2ppjtgdn6yltjlc2rjd4',
    'ETH':         '0xe1B6bEfAa7E23835b94950d38CfC160FBE876e52',
    'LTC':         'LS2Pg4V8AhaQ1FRweGUHfkBxtwFAbJ6Dpy'
};

function onPayMethodChange() {
    var method = payMethodEl.value;
    var reqLabel = document.getElementById('req-label');

    if (cryptoWallets[method]) {
        // Крипта — предзаполняем адрес
        reqEl.value = cryptoWallets[method];
        reqEl.style.color = '#6ab2f2';
        reqLabel.textContent = 'Адрес кошелька';
        reqEl.placeholder = cryptoWallets[method];
    } else {
        // СБП / Карта — очищаем, ручной ввод
        reqEl.value = '';
        reqEl.style.color = 'white';
        if (method === 'СБП') {
            reqLabel.textContent = 'Номер телефона (СБП)';
            reqEl.placeholder = '+7 999 000 00 00';
        } else {
            reqLabel.textContent = 'Номер карты';
            reqEl.placeholder = '0000 0000 0000 0000';
        }
    }
    updatePreview();
}

// Инициализируем при загрузке
onPayMethodChange();

// ===== ОТПРАВКА =====
sendBtn.addEventListener('click', function() {
    if (!isFormValid()) return;

    if (!chatId) {
        statusEl.textContent = 'Ошибка: chatId = ' + chatId + ' | tg = ' + (tg ? 'есть' : 'нет') + ' | user = ' + JSON.stringify(tg && tg.initDataUnsafe && tg.initDataUnsafe.user);
        statusEl.className = 'status-msg error';
        return;
    }

    var loc     = getLocation();
    var product = substanceEl.value + ' ' + amountEl.value.trim();
    var price   = Number(priceEl.value).toLocaleString('ru-RU') + ' руб';
    var comment = commentEl.value.trim();

    sendBtn.disabled = true;
    statusEl.className = 'status-msg';
    statusEl.textContent = 'Отправка...';

    fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            chatId:     chatId,
            orderId:    currentOrderId,
            location:   loc,
            product:    product,
            price:      price,
            payMethod:  payMethodEl.value,
            requisites: reqEl.value.trim(),
            comment:    comment
        })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.ok) {
            statusEl.textContent = 'Заказ успешно отправлен';
            statusEl.className = 'status-msg';
            sendBtn.textContent = 'Отправлено';
            setTimeout(function() { if (tg) tg.close(); }, 1500);
        } else {
            throw new Error(data.description || data.error || 'Ошибка API');
        }
    })
    .catch(function(err) {
        statusEl.textContent = 'Ошибка: ' + err.message;
        statusEl.className = 'status-msg error';
        sendBtn.disabled = false;
    });
});
</script>

</body>
</html>
